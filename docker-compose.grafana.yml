services:
  grafana-db-init:
    image: postgres:16-alpine
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerpilot}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-ledgerpilot_grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD (>=16 chars) in .env}
    volumes:
      - ./deploy/grafana/bootstrap-readonly-role.sql:/bootstrap/bootstrap-readonly-role.sql:ro
    command:
      - sh
      - -c
      - psql -v ON_ERROR_STOP=1 -h postgres -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -f /bootstrap/bootstrap-readonly-role.sql

  grafana-renderer:
    image: grafana/grafana-image-renderer:latest
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "true"
      BROWSER_TZ: UTC
    expose:
      - "8081"

  grafana:
    image: grafana/grafana-oss:11.3.0
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      grafana-db-init:
        condition: service_completed_successfully
      grafana-renderer:
        condition: service_started
    environment:
      GF_SERVER_HTTP_PORT: "3000"
      GF_SERVER_ROOT_URL: ${GRAFANA_PUBLIC_URL:-http://127.0.0.1:3002}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-grafana_operator}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_THEME: ${GRAFANA_DEFAULT_THEME:-light}
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_VIEWER:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpilot}
      GRAFANA_DB_HOST: ${GRAFANA_DB_HOST:-postgres}
      GRAFANA_DB_PORT: ${GRAFANA_DB_PORT:-5432}
      GRAFANA_DB_USER: ${GRAFANA_DB_USER:-ledgerpilot_grafana_ro}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Set GRAFANA_DB_PASSWORD in .env}
      GRAFANA_DB_SSLMODE: ${GRAFANA_DB_SSLMODE:-disable}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3002}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  grafana-data:
