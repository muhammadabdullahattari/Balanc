name: Publish API container

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  publish:
    needs: [checks]
    name: Publish versioned API image to GitHub Container Registry
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set lowercase image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_OUTPUT"
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=tag
            type=sha
      - name: Download checked API image
        uses: actions/download-artifact@v8
        with:
          name: ledgerpilot-api-image-${{ github.sha }}
          path: /tmp/checked-image
      - name: Publish checked image
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          docker load --input /tmp/checked-image/api-image.tar
          while IFS= read -r tag; do
            docker tag "ledgerpilot-api:${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
