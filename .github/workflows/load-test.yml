name: Staging Load and Spike Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target staging environment URL (disposable/staging only)'
        required: true
        default: 'http://127.0.0.1:8000'
      load_target:
        description: 'Target number of virtual users / requests (e.g. 1000, 5000, 10000)'
        required: true
        default: '1000'
      load_mode:
        description: 'Load test mode (rps or concurrency)'
        required: true
        default: 'rps'
        type: choice
        options:
          - rps
          - concurrency

permissions:
  contents: read

concurrency:
  group: load-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  spike-test:
    name: Execute k6 Spike Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify Target is Staging or Disposable
        run: |
          TARGET="${{ inputs.target_url }}"
          if [[ "$TARGET" =~ (production|balanc\.app|balanc-production) ]]; then
            echo "ERROR: Target appears to be production! Spike tests are strictly restricted to staging or disposable environments."
            exit 1
          fi
          echo "Target confirmed non-production: $TARGET"

      - name: Setup uv and prepare test fixtures
        uses: astral-sh/setup-uv@f94ec6bed567a21f333e551d6e66e60b0945607d # v5.3.0
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Run k6 load script
        env:
          LOAD_ORIGIN: ${{ inputs.target_url }}
          LEDGERPILOT_DISPOSABLE_TARGET: "yes"
          LOAD_TARGET: ${{ inputs.load_target }}
          LOAD_MODE: ${{ inputs.load_mode }}
          FIXTURES: ${{ github.workspace }}/tmp/spike-fixtures.json
        run: |
          mkdir -p tmp
          echo '[]' > tmp/spike-fixtures.json
          echo "Running k6 spike test against ${{ inputs.target_url }}..."
          # Running via containerized k6
          docker run --rm \
            -e LOAD_ORIGIN="${{ inputs.target_url }}" \
            -e LEDGERPILOT_DISPOSABLE_TARGET="yes" \
            -e LOAD_TARGET="${{ inputs.load_target }}" \
            -e LOAD_MODE="${{ inputs.load_mode }}" \
            -v "${{ github.workspace }}/scripts/load:/scripts/load" \
            grafana/k6:latest run /scripts/load/smoke.js
