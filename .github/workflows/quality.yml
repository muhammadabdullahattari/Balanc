name: CI and demo deployment

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Run tests with coverage
        run: uv run coverage run -m pytest -q && uv run coverage report
      - name: Compile Python sources
        run: uv run python -m compileall -q src

  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build production web application
        run: npm run build
      - name: Save production bundle
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build API container
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag ledgerpilot-api:${{ github.sha }} backend

  deploy-api-demo:
    name: Deploy API demo to AWS EC2 through SSM
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && vars.AWS_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.AWS_ACCOUNT_ID != '' && vars.ECR_REPOSITORY != '' && vars.EC2_INSTANCE_ID != ''
    runs-on: ubuntu-latest
    needs: [backend, frontend, container]
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish API image
        id: image
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          image="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker buildx build --file backend/Dockerfile --tag "$image" --push backend
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy image through AWS Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /opt/ledgerpilot/deploy-api.sh $IMAGE_URI $AWS_REGION" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json



