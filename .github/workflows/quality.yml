name: CI and demo deployment

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy-api-demo:
    name: Deploy API demo to AWS EC2 through SSM
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.ENABLE_DEMO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    needs: [checks]
    environment: demo
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment environment
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          for name in AWS_ROLE_ARN AWS_REGION AWS_ACCOUNT_ID ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "Missing demo environment variable: $name" >&2
              exit 1
            fi
          done
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Sign in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Download checked API image
        uses: actions/download-artifact@v8
        with:
          name: ledgerpilot-api-image-${{ github.sha }}
          path: /tmp/checked-image
      - name: Publish checked API image
        id: image
        env:
          REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com
        run: |
          docker load --input /tmp/checked-image/api-image.tar
          image="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker tag "ledgerpilot-api:${GITHUB_SHA}" "$image"
          docker push "$image"
          echo "uri=$image" >> "$GITHUB_OUTPUT"
      - name: Deploy image through AWS Systems Manager
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=sudo /opt/ledgerpilot/deploy-api.sh $IMAGE_URI $AWS_REGION" \
            --query 'Command.CommandId' --output text)"
          aws ssm wait command-executed --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID"
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' --output json



