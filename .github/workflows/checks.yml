name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        run: uv sync --locked --all-groups
      - name: Lint
        run: uv run ruff check src tests
      - name: Type check
        run: uv run mypy
      - name: Audit Python dependencies
        run: uv run pip-audit --skip-editable --format json --output dependency-audit.json
      - name: Check reviewed OpenAPI contract
        run: |
          uv run python -m ledgerpilot.export_openapi --check
          uv run python -m ledgerpilot.verify_traceability
      - name: Run tests with coverage
        run: uv run coverage run -m pytest -q && uv run coverage report
      - name: Compile Python sources
        run: uv run python -m compileall -q src
      - name: Prepare isolated local database credentials
        run: uv run python -m ledgerpilot.local_setup prepare
      - name: Start PostgreSQL with restricted roles
        working-directory: .
        run: docker compose up -d --wait --wait-timeout 90 postgres
      - name: Verify database grants and password rotation
        run: uv run python -m ledgerpilot.local_setup verify --check-rotation
      - name: Verify unsafe bootstrap configurations fail without mutation
        env:
          RUN_DB_BOOTSTRAP_TESTS: '1'
        run: uv run pytest tests/test_bootstrap_integration.py -q
      - name: Start local SMTP mailbox
        timeout-minutes: 2
        working-directory: .
        run: |
          docker compose -f docker-compose.auth.yml up -d
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 60 --connect-timeout 2 --max-time 5 --output /dev/null http://127.0.0.1:8025/api/v1/messages
      - name: Start bounded local malware scanner
        working-directory: .
        run: docker compose -f docker-compose.documents.yml up -d --build --wait --wait-timeout 300
      - name: Verify backend on isolated PostgreSQL, SMTP and ClamAV
        env:
          RUN_PHASE2_INTEGRATION: '1'
          RUN_DOCUMENT_SCANNER_TESTS: '1'
          RUN_LOCAL_OCR_TESTS: '1'
          RUN_DB_BOOTSTRAP_TESTS: '1'
        run: |
          uv run coverage run -m pytest tests -q --junitxml=phase4-results.xml
          uv run coverage json -o phase4-coverage.json
          uv run coverage report
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web acceptance dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify real web workflows on isolated API and PostgreSQL
        working-directory: frontend
        env:
          LEDGERPILOT_TEST_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: npm run test:live
      - name: Verify production browser with real API and PostgreSQL
        working-directory: frontend
        env:
          LEDGERPILOT_TEST_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: |
          npm run build
          npx playwright install --with-deps chromium
          npm run test:browser:types
          npm run test:browser:live
      - name: Save frontend integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-web-live-${{ github.sha }}
          path: |
            tmp/phase5/live-results.json
            tmp/phase8/browser-results.json
            tmp/phase8/browser-artifacts/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 7
      - name: Save backend verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-backend-verification-${{ github.sha }}
          path: |
            backend/phase4-results.xml
            backend/phase4-coverage.json
            backend/dependency-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Stop local malware scanner
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.documents.yml down --volumes
      - name: Stop local SMTP mailbox
        if: always()
        working-directory: .
        run: docker compose -f docker-compose.auth.yml down
      - name: Stop disposable CI database
        if: always()
        working-directory: .
        run: docker compose down --volumes

  frontend:
    name: Frontend checks and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit web runtime and high-severity tooling dependencies
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=high --json > frontend-dependency-audit.json
      - name: Check generated API types and browser transport
        run: |
          npm run integration:check
          npm run api:check
          npm run test:api
          npm run test:ui
          npm run format:check
      - name: Build production web application
        run: npm run build
      - name: Install Chromium for UI acceptance
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser UI journeys
        run: |
          npm run test:browser:types
          npm run test:browser
      - name: Save browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-phase6-browser-${{ github.sha }}
          path: |
            tmp/phase6/
            frontend/test-results/
            frontend/frontend-dependency-audit.json
          if-no-files-found: warn
          retention-days: 7
      - name: Save production bundle
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  container:
    name: Build API container
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag ledgerpilot-api:${{ github.sha }} backend
      - name: Verify deployment failure and rollback control flow
        run: docker run --rm --user 0 --entrypoint python --mount type=bind,source=${{ github.workspace }},target=/source,readonly ledgerpilot-api:${{ github.sha }} /source/backend/tests/deploy_shell_harness.py
      - name: Verify persistent originals and invalid-database readiness
        run: python scripts/check-deployment-container.py ledgerpilot-api:${{ github.sha }}
      - name: Save checked API image
        run: docker save ledgerpilot-api:${{ github.sha }} --output /tmp/api-image.tar
      - name: Upload checked API image
        uses: actions/upload-artifact@v7
        with:
          name: ledgerpilot-api-image-${{ github.sha }}
          path: /tmp/api-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
