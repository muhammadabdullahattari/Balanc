name: Required checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend-quality:
    name: Backend Quality (Lint, Format, Mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Verify locked dependencies
        run: uv sync --locked --all-groups
      - name: Ruff Lint Check
        run: uv run ruff check src tests
      - name: Ruff Format Check
        run: uv run ruff format --check src tests
      - name: Mypy Type Check
        run: uv run mypy

  contract-checks:
    name: Contract Checks (OpenAPI, Traceability, API Sync)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Verify OpenAPI contract and requirement traceability
        working-directory: backend
        run: |
          uv run python -m ledgerpilot.export_openapi --check
          uv run python -m ledgerpilot.verify_traceability
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify frontend API types and call sites match contract
        working-directory: frontend
        run: |
          npm run api:check
          npm run integration:check

  frontend:
    name: Frontend Quality and Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Prettier Code Style Check
        run: npm run format:check
      - name: Run API client and contract unit tests
        run: npm run test:api
      - name: Run frontend UI test suite
        run: npm run test:ui
      - name: Build production web bundle
        run: npm run build
      - name: Upload production web bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgerpilot-web-${{ github.sha }}
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 7

  infra-checks:
    name: Infrastructure and Configuration Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Docker Compose configurations
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.documents.yml config --quiet
          docker compose -f docker-compose.performance.yml config --quiet
          POSTGRES_PASSWORD=ci-placeholder-pg-password GRAFANA_DB_PASSWORD=ci-placeholder-ro-password GRAFANA_ADMIN_PASSWORD=ci-placeholder-admin-pass docker compose -f docker-compose.yml -f docker-compose.grafana.yml config --quiet
      - name: Check Prometheus alert rules syntax
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/prometheus:/etc/prometheus" --entrypoint promtool prom/prometheus:v2.54.1 check rules /etc/prometheus/alerts.yml
      - name: Run Prometheus alert rules unit tests
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/prometheus:/etc/prometheus" -w /etc/prometheus --entrypoint promtool prom/prometheus:v2.54.1 test rules alerts_test.yml
      - name: Lint Dockerfiles with Hadolint
        run: |
          docker run --rm -i hadolint/hadolint:latest hadolint - < backend/Dockerfile
          docker run --rm -i hadolint/hadolint:latest hadolint - < backend/Dockerfile.ocr

  security-audit:
    name: Security and Dependency Audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Audit Python dependencies (pip-audit)
        working-directory: backend
        run: uv run pip-audit --skip-editable --format json --output dependency-audit.json
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: Scan repository for secrets (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-tests:
    name: Backend Integration Suite with Live Services
    needs: [backend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Compile Python sources
        working-directory: backend
        run: uv run python -m compileall -q src
      - name: Prepare isolated local database credentials
        working-directory: backend
        run: uv run python -m ledgerpilot.local_setup prepare
      - name: Start PostgreSQL with restricted roles
        run: docker compose up -d --wait --wait-timeout 90 postgres
      - name: Verify database grants and password rotation
        working-directory: backend
        run: uv run python -m ledgerpilot.local_setup verify --check-rotation
      - name: Start standard SMTP test server
        working-directory: backend
        run: |
          uv run python -m ledgerpilot.testing.smtp_server &
          sleep 2
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 60 --connect-timeout 2 --max-time 5 --output /dev/null http://127.0.0.1:8025/api/v1/messages
      - name: Start Redis rate limiter and report cache
        run: docker compose -f docker-compose.performance.yml up -d
      - name: Start ClamAV and OCR scanner services
        run: docker compose -f docker-compose.documents.yml up -d --build --wait --wait-timeout 300
      - name: Run full backend integration test suite with coverage
        working-directory: backend
        env:
          RUN_PHASE2_INTEGRATION: '1'
          RUN_DOCUMENT_SCANNER_TESTS: '1'
          RUN_LOCAL_OCR_TESTS: '1'
          RUN_DB_BOOTSTRAP_TESTS: '1'
          LEDGERPILOT_TEST_REDIS_URL: 'redis://127.0.0.1:16379/0'
        run: |
          uv run coverage run -m pytest tests -q --junitxml=backend-results.xml
          uv run coverage json -o backend-coverage.json
          uv run coverage report
      - name: Enforce zero skipped tests allowlist
        working-directory: backend
        run: |
          python -c "
          import xml.etree.ElementTree as ET, sys
          tree = ET.parse('backend-results.xml')
          root = tree.getroot()
          tests = int(root.attrib.get('tests', 0))
          failures = int(root.attrib.get('failures', 0))
          errors = int(root.attrib.get('errors', 0))
          skipped = int(root.attrib.get('skipped', 0))
          passed = tests - failures - errors - skipped
          print(f'Test Summary: {passed} passed, {failures + errors} failed, {skipped} skipped out of {tests} total')
          if skipped > 0:
              print(f'ERROR: Found {skipped} skipped tests! CI allowlist requires 0 skipped.')
              sys.exit(1)
          if failures > 0 or errors > 0:
              sys.exit(1)
          "
      - name: Setup Node.js for live acceptance checks
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install web acceptance dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify real web workflows on isolated API and PostgreSQL
        working-directory: frontend
        env:
          LEDGERPILOT_TEST_PYTHON: ${{ github.workspace }}/backend/.venv/bin/python
        run: npm run test:live
      - name: Save backend verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgerpilot-backend-verification-${{ github.sha }}
          path: |
            backend/backend-results.xml
            backend/backend-coverage.json
          if-no-files-found: warn
          retention-days: 7
      - name: Teardown Compose service stack
        if: always()
        run: |
          docker compose -f docker-compose.documents.yml down --volumes || true
          docker compose -f docker-compose.performance.yml down --volumes || true
          docker compose down --volumes || true

  migrations:
    name: Database Migrations and Drift Check
    needs: [backend-quality]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --locked --all-groups
      - name: Prepare isolated local database credentials
        working-directory: backend
        run: uv run python -m ledgerpilot.local_setup prepare
      - name: Start PostgreSQL with restricted roles
        run: docker compose up -d --wait --wait-timeout 90 postgres
      - name: Run Alembic upgrade through 0036 on fresh database
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Assert exactly one Alembic head
        working-directory: backend
        run: |
          HEADS=$(uv run alembic heads)
          echo "Current heads: $HEADS"
          HEAD_COUNT=$(echo "$HEADS" | grep -c "head" || true)
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 Alembic head, but found $HEAD_COUNT"
            exit 1
          fi
      - name: Verify model and migration drift (alembic check)
        working-directory: backend
        run: uv run alembic check
      - name: Verify migration downgrade and upgrade reversibility
        working-directory: backend
        run: |
          uv run alembic downgrade -1
          uv run alembic upgrade head
      - name: Teardown database
        if: always()
        run: docker compose down --volumes || true

  container:
    name: Build API Container and Verify Control Flow
    needs: [backend-tests, frontend, migrations]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build API image
        run: docker build --file backend/Dockerfile --tag ledgerpilot-api:${{ github.sha }} backend
      - name: Scan container image with Trivy (Fail on Critical/High)
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec # master
        with:
          image-ref: ledgerpilot-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Verify deployment failure and rollback control flow
        run: |
          docker run --rm --user 0 --entrypoint python --mount type=bind,source=${{ github.workspace }},target=/source,readonly ledgerpilot-api:${{ github.sha }} /source/backend/tests/deploy_shell_harness.py
      - name: Verify persistent originals and invalid-database readiness
        run: python scripts/check-deployment-container.py ledgerpilot-api:${{ github.sha }}
      - name: Save checked API image
        run: docker save ledgerpilot-api:${{ github.sha }} --output /tmp/api-image.tar
      - name: Upload checked API image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ledgerpilot-api-image-${{ github.sha }}
          path: /tmp/api-image.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  smoke-test:
    name: k6 Smoke Test Against Stack
    needs: [container]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download API image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ledgerpilot-api-image-${{ github.sha }}
          path: /tmp/image
      - name: Load API image into Docker
        run: docker load --input /tmp/image/api-image.tar
      - name: Setup uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: 0.12.7
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Start Compose database and cache dependencies
        run: |
          uv run --directory backend python -m ledgerpilot.local_setup prepare
          docker compose up -d --wait --wait-timeout 90 postgres
          docker compose -f docker-compose.performance.yml up -d
          uv run --directory backend alembic upgrade head
      - name: Run API container
        run: |
          sed -E "s/^([^=]+)='(.*)'$/\1=\2/; s/^([^=]+)=\"(.*)\"$/\1=\2/" .env > .env.docker
          docker run -d --name ledgerpilot-smoke-api --network host \
            --env-file .env.docker \
            -e SESSION_SIGNING_KEY="smoke-test-signing-key-minimum-32-bytes-long" \
            ledgerpilot-api:${{ github.sha }}
          curl --fail --retry 15 --retry-all-errors --retry-delay 1 --retry-max-time 30 http://127.0.0.1:8000/health/live || (docker logs ledgerpilot-smoke-api && exit 1)
      - name: Execute k6 smoke test
        run: |
          docker run --rm --network host -v "${{ github.workspace }}/scripts/load:/load" grafana/k6:latest run /load/smoke.js
      - name: Teardown smoke stack
        if: always()
        run: |
          docker rm -f ledgerpilot-smoke-api || true
          docker compose -f docker-compose.performance.yml down --volumes || true
          docker compose down --volumes || true
