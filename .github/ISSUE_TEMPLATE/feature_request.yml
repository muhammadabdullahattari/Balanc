name: Feature request
description: Propose a change tied to LedgerPilot's SRS and release scope
title: "[Feature]: "
labels: [enhancement]
body:
  - type: input
    id: srs
    attributes:
      label: SRS requirement or phase
      description: Give the FR, NFR, SEC, VAL, UC, or implementation-plan phase this work supports.
      placeholder: FR-001 / Phase 2
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: User or business problem
      description: Describe the job the user needs to complete and the current failure or friction.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Include expected behavior, errors, permissions, and measurable outcomes.
      placeholder: |
        - Given ...
        - When ...
        - Then ...
    validations:
      required: true
  - type: textarea
    id: accounting
    attributes:
      label: Accounting impact
      description: State whether this changes cash/accrual timing, journal effects, balances, reports, or tax treatment. Use "No financial effect" when appropriate.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data, tenant, and security impact
      description: Identify affected business data, role access, audit behavior, and external providers.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Required verification
      description: List the unit, API, PostgreSQL, UI, integration, or E2E evidence needed.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Release scope
      options:
        - label: This request is within the approved responsive web P1 scope.
          required: true
        - label: This request does not add native mobile, live money movement, tax filing, or an unapproved external API.
          required: true

