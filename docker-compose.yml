services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerpilot}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerpilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-password}
      APP_DB_USER: ${APP_DB_USER:-ledgerpilot_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-replace-with-a-password}
      MIGRATION_DB_USER: ${MIGRATION_DB_USER:-ledgerpilot_migrator}
      MIGRATION_DB_PASSWORD: ${MIGRATION_DB_PASSWORD:-replace-with-a-password}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/db/init/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
