# Optional local document worker dependency; no cloud account or paid upgrade.
name: ledgerpilot-documents
services:
  ocr:
    build:
      context: ./backend
      dockerfile: Dockerfile.ocr
    image: ledgerpilot-ocr:phase3
    networks:
      - ocr-private
    restart: unless-stopped
    ports:
      - "127.0.0.1:8071:8071"
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Run the local credential preparation helper first}
      OMP_THREAD_LIMIT: "1"
    mem_limit: 2g
    cpus: 2
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=134217728,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  clamav:
    # Official stable image resolved and verified as ClamAV 1.5.4 on 29 October 2026.
    image: clamav/clamav@sha256:bda39705e291105049c3936e2803ac90b955172af8030f94f05dce1252df6c6d
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-signatures:/var/lib/clamav
    mem_limit: 4g
    cpus: 2
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 120s
volumes:
  clamav-signatures:
networks:
  ocr-private:
    # Host-run FastAPI/worker must reach the loopback-published port on Docker Desktop.
    # Production deployment must enforce outbound restrictions at its network boundary.
    driver: bridge
