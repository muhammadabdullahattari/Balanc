apiVersion: 1

providers:
  - name: LedgerPilot Provisioned Dashboards
    orgId: 1
    folder: LedgerPilot Financial & Audit Reports
    folderUid: lp-reports-folder
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
