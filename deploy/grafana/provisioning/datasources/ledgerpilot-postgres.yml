apiVersion: 1

datasources:
  - name: LedgerPilot PostgreSQL (Read-Only)
    uid: ledgerpilot-postgres-ro
    type: postgres
    access: proxy
    url: ${GRAFANA_DB_HOST}:${GRAFANA_DB_PORT}
    user: ${GRAFANA_DB_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: ${GRAFANA_DB_SSLMODE}
      postgresVersion: 1600
      timescaledb: false
      maxOpenConns: 8
      maxIdleConns: 4
      connMaxLifetime: 300
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
